services:
  autopassport:
    build: .
    container_name: autopassport-mvp
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/autopassport.db}
      STORAGE_PATH: ${STORAGE_PATH:-./data/storage}
      BACKUP_PATH: ${BACKUP_PATH:-./data/backups}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      ATTACHMENT_RETENTION_DAYS: ${ATTACHMENT_RETENTION_DAYS:-30}
      ADMIN_BACKUP_TOKEN: ${ADMIN_BACKUP_TOKEN:-}
    volumes:
      - autopassport_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  autopassport_data:
