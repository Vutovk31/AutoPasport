<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icons/icon-192.png"><link rel="stylesheet" href="/static/styles.css"><title>AutoPassport</title></head><body>
<header><strong>AutoPassport</strong><small>электронный паспорт автомобиля</small><button id="installApp" hidden>Установить</button></header><main>
<section id="auth" class="card"><h1>Вход владельца</h1><form id="authForm"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="10" placeholder="Пароль" required><button>Войти / зарегистрироваться</button></form><p id="message" role="status"></p></section>
<section id="app" hidden><div class="page"><h1>Мой гараж</h1><button id="share" hidden>Ссылка на 1 час</button></div>
<section id="storageCard" class="card storage-card" aria-live="polite"><div class="storage-head"><div><h2>Хранилище документов</h2><p id="storageSummary">Загрузка данных…</p></div><button id="refreshStorage" type="button" class="secondary">Обновить</button></div><div class="meter-row"><span>Документы</span><strong id="storageAttachments">—</strong></div><progress id="attachmentsProgress" max="100" value="0"></progress><div class="meter-row"><span>Объём</span><strong id="storageBytes">—</strong></div><progress id="bytesProgress" max="100" value="0"></progress><p id="storageWarning" class="warning" hidden></p></section>
<form id="vehicleForm" class="card grid"><input name="vin" maxlength="17" placeholder="VIN" required><input name="registration_number" placeholder="Госномер"><input name="make" placeholder="Марка" required><input name="model" placeholder="Модель" required><input name="trim" placeholder="Модификация"><input name="year" type="number" placeholder="Год" required><input name="current_mileage" type="number" placeholder="Пробег" required><input name="purchase_date" type="date"><input name="purchase_mileage" type="number" placeholder="Пробег при покупке"><button>Добавить автомобиль</button></form><div id="garage"></div><section id="detail" hidden><div class="actions"><button id="downloadPdf" type="button">PDF-паспорт</button></div><div id="vehicle" class="card"></div>
<form id="visitForm" class="card grid"><h2>Ремонтный визит</h2><select name="kind"><option value="repair_visit">Ремонтный визит</option><option value="maintenance_visit">ТО</option><option value="diagnostic_visit">Диагностика</option><option value="estimate_visit">Смета</option><option value="note">Заметка</option></select><input name="visit_date" type="date" required><input name="mileage" type="number" placeholder="Пробег"><input name="title" placeholder="Название визита" required><input name="location" placeholder="Сервис / мастер"><input name="total_cost_rubles" placeholder="Сумма визита, ₽"><select name="total_cost_status"><option value="known">Стоимость известна</option><option value="free">Бесплатно</option><option value="unknown">Неизвестно</option><option value="not_applicable">Не применимо</option></select><label><input name="total_cost_visible_to_public" type="checkbox"> Показывать сумму публично</label><h3>Первая операция / деталь</h3><select name="item_type"><option value="operation">Операция</option><option value="part">Запчасть</option><option value="fluid">Жидкость</option><option value="labor">Работа</option><option value="diagnostic">Диагностика</option></select><input name="item_title" placeholder="Что сделали / установили" required><input name="item_brand" placeholder="Бренд"><input name="item_quantity" placeholder="Количество"><input name="item_unit" placeholder="Ед. изм."><input name="item_cost_rubles" placeholder="Стоимость позиции, ₽"><select name="item_cost_status"><option value="known">Стоимость известна</option><option value="included_in_visit">Входит в сумму визита</option><option value="free">Бесплатно</option><option value="unknown">Неизвестно</option><option value="not_applicable">Не применимо</option></select><button>Добавить визит</button></form>
<form id="eventForm" class="card grid"><h2>Одиночное событие</h2><select name="kind"><option value="repair">Ремонт</option><option value="maintenance">ТО</option><option value="diagnostic">Диагностика</option><option value="estimate">Смета</option></select><input name="event_date" type="date" required><input name="mileage" type="number" placeholder="Пробег (необязательно)"><input name="title" placeholder="Событие" required><input name="description" placeholder="Описание"><input name="cost_rubles" placeholder="Стоимость, ₽"><label><input name="cost_visible_to_public" type="checkbox"> Показывать стоимость публично</label><button>Добавить событие</button></form><h2>Визиты ремонта</h2><div id="visits"></div><h2>События</h2><div id="timeline"></div></section></section>
</main><script type="module" src="/static/main.js"></script></body></html>
