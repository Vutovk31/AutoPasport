<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AutoPassport — Документы</title>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--ink:#10213d;--muted:#637087;--line:#dfe6ef;--brand:#1769e0;--brand-dark:#0c3978;--ok:#087b55;--warn:#9a6100;--bad:#ad2d2d;--radius:18px;--tap:48px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:86px}.top{padding:calc(18px + env(safe-area-inset-top)) 18px 22px;background:linear-gradient(145deg,#071b39,var(--brand-dark));color:#fff}.top small{color:#c5d3e8}.top h1{margin:5px 0 0;font-size:24px}.main{padding:16px}.hero,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(16,33,61,.07)}.hero{padding:18px}.hero h2{margin:0 0 7px;font-size:18px}.hero p{margin:0;color:var(--muted);line-height:1.45}.primary{width:100%;min-height:var(--tap);border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;margin-top:16px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section h2{font-size:16px;margin:0}.section button{border:0;background:transparent;color:var(--brand);font-weight:700;min-height:44px}.list{display:grid;gap:10px}.doc{padding:14px;display:flex;gap:12px;align-items:flex-start}.doc-icon{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:#eaf2ff;color:var(--brand);display:grid;place-items:center;font-size:20px}.doc strong{display:block;font-size:14px;overflow-wrap:anywhere}.doc small{display:block;color:var(--muted);margin-top:4px;line-height:1.35}.badge{display:inline-flex;margin-top:8px;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.uploaded,.processing{background:#eaf2ff;color:#1758a8}.needs_review{background:#fff1d9;color:var(--warn)}.confirmed{background:#dbf5ea;color:var(--ok)}.failed{background:#ffe3e3;color:var(--bad)}.state{padding:28px 18px;text-align:center}.state h3{margin:0 0 7px}.state p{margin:0;color:var(--muted);line-height:1.45}.retry{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:750;margin-top:14px}.offline{display:none;padding:10px 14px;background:#fff0d8;color:#7b4d00;font-size:13px;text-align:center}.offline.show{display:block}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;min-height:52px;color:#6c778a;font-size:11px}.nav b{display:block;font-size:19px;margin-bottom:3px}.nav .active{color:var(--brand)}.sheet{position:fixed;inset:0;background:rgba(7,27,57,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet.show{display:flex}.panel{width:min(430px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 16px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:750}.field input,.field select{width:100%;min-height:48px;border:1px solid #ced7e4;border-radius:13px;padding:10px 12px;background:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{min-height:48px;border:0;border-radius:13px;font-weight:800}.cancel{background:#edf1f6;color:var(--ink)}.submit{background:var(--brand);color:#fff}.submit:disabled{opacity:.55}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:319px){.app,.nav{min-width:320px}}@media(min-width:431px){body{padding:18px}.app{border-radius:26px;overflow:hidden;box-shadow:0 18px 60px rgba(16,33,61,.16)}.nav{bottom:18px;border-radius:0 0 26px 26px}}
</style>
</head>
<body>
<div class="app">
<div id="offline" class="offline" role="status">Нет соединения. Показываем последнее доступное состояние.</div>
<header class="top"><small>AutoPassport</small><h1>Документы автомобиля</h1></header>
<main class="main">
<section class="hero" aria-labelledby="hero-title"><h2 id="hero-title">Добавьте чек или заказ-наряд</h2><p>Документ сохранится во входящих. Запись об обслуживании появится только после вашей проверки и подтверждения.</p><button id="openUpload" class="primary">Добавить документ</button></section>
<div class="section"><h2>Входящие документы</h2><button id="refresh">Обновить</button></div>
<div id="content" aria-live="polite"></div>
</main>
<nav class="nav" aria-label="Основная навигация"><button><b>⌂</b>Главная</button><button class="active" aria-current="page"><b>▤</b>Документы</button><button><b>🚘</b>Авто</button></nav>
</div>
<div id="uploadSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
<form id="uploadForm" class="panel"><h2 id="uploadTitle">Новый документ</h2><div class="field"><label for="documentType">Тип документа</label><select id="documentType" name="document_type" required><option value="receipt">Чек</option><option value="work_order">Заказ-наряд</option><option value="invoice">Счёт</option><option value="other">Другой документ</option></select></div><div class="field"><label for="file">Файл PDF, JPG или PNG</label><input id="file" name="file" type="file" accept="application/pdf,image/jpeg,image/png" required></div><div class="actions"><button class="cancel" type="button" id="cancelUpload">Отмена</button><button class="submit" id="submitUpload" type="submit">Загрузить</button></div><p id="formMessage" role="status"></p></form>
</div>
<script>
(()=>{const $=s=>document.querySelector(s);const vehicleId=new URLSearchParams(location.search).get('vehicle_id');const content=$('#content'),sheet=$('#uploadSheet'),form=$('#uploadForm'),submit=$('#submitUpload');const statusText={uploaded:'Загружен',processing:'Обрабатывается',needs_review:'Нужно проверить',confirmed:'Подтверждён',failed:'Не удалось обработать'};function state(title,text,retry=false){content.innerHTML=`<section class="card state"><h3>${title}</h3><p>${text}</p>${retry?'<button class="retry" id="retryState">Повторить</button>':''}</section>`;if(retry)$('#retryState').onclick=load}function render(items){if(!items.length)return state('Документов пока нет','Добавьте первый чек или заказ-наряд. Он не изменит историю автомобиля без вашего подтверждения.');content.innerHTML='<div class="list">'+items.map(d=>`<article class="card doc"><div class="doc-icon" aria-hidden="true">▧</div><div><strong>${escapeHtml(d.original_name)}</strong><small>${formatDate(d.created_at)} · ${formatBytes(d.size_bytes)}</small><span class="badge ${d.status}">${statusText[d.status]||'Статус неизвестен'}</span>${d.failure_reason?`<small>Причина: ${escapeHtml(d.failure_reason)}</small>`:''}</div></article>`).join('')+'</div>'}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function formatDate(v){return new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}function formatBytes(v){if(v<1024)return v+' Б';if(v<1048576)return Math.round(v/1024)+' КБ';return (v/1048576).toFixed(1).replace('.',',')+' МБ'}async function load(){if(!vehicleId)return state('Не выбран автомобиль','Откройте документы из карточки автомобиля. Идентификатор автомобиля не передаётся вручную.');state('Загружаем документы','Обычно это занимает несколько секунд.');try{const r=await fetch(`/api/vehicles/${encodeURIComponent(vehicleId)}/documents`,{credentials:'same-origin'});if(!r.ok)throw new Error(r.status===401?'Нужно войти в аккаунт':'Не удалось получить документы');const data=await r.json();render(Array.isArray(data.documents)?data.documents:[])}catch(e){state('Документы не загрузились',e.message||'Проверьте соединение и повторите попытку.',true)}}async function upload(e){e.preventDefault();if(!vehicleId)return;submit.disabled=true;submit.textContent='Загружаем…';$('#formMessage').textContent='';try{const r=await fetch(`/api/vehicles/${encodeURIComponent(vehicleId)}/documents`,{method:'POST',body:new FormData(form),credentials:'same-origin'});if(!r.ok){const body=await r.json().catch(()=>({}));throw new Error(body.detail||'Не удалось загрузить документ')}form.reset();close();await load()}catch(e){$('#formMessage').textContent=typeof e.message==='string'?e.message:'Не удалось загрузить документ'}finally{submit.disabled=false;submit.textContent='Загрузить'}}function open(){if(!vehicleId)return state('Не выбран автомобиль','Откройте документы из карточки автомобиля.');sheet.classList.add('show');$('#documentType').focus()}function close(){sheet.classList.remove('show');$('#openUpload').focus()}$('#openUpload').onclick=open;$('#cancelUpload').onclick=close;$('#refresh').onclick=load;form.onsubmit=upload;sheet.addEventListener('click',e=>{if(e.target===sheet)close()});addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('show'))close()});function online(){const off=!navigator.onLine;$('#offline').classList.toggle('show',off)}addEventListener('online',()=>{online();load()});addEventListener('offline',online);online();load();window.__MVE__={escapeHtml,formatBytes,statusText}})();
</script>
</body></html>
