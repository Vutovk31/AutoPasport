name: AutoPassport CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./data/ci.db
      STORAGE_PATH: ./data/storage
      BACKUP_PATH: ./data/backups
      ADMIN_BACKUP_TOKEN: ci-admin-token
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      COOKIE_SECURE: false
      ATTACHMENT_RETENTION_DAYS: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap release verification report
        shell: bash
        run: |
          mkdir -p data/reports
          cat > data/reports/release-check.json <<'JSON'
          {
            "status": "bootstrap",
            "passed": false,
            "failed_steps": ["workflow_before_release_runner"],
            "message": "Release runner did not replace the bootstrap report. Inspect preceding workflow steps."
          }
          JSON
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete release verification
        run: python scripts/release_check.py --report-path data/reports/release-check.json
      - name: Publish release verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopassport-release-check
          path: data/reports/release-check.json
          if-no-files-found: error
          retention-days: 14
