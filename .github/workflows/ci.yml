name: AutoPassport CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./data/ci.db
      STORAGE_PATH: ./data/storage
      BACKUP_PATH: ./data/backups
      ADMIN_BACKUP_TOKEN: ci-admin-token
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      COOKIE_SECURE: false
      ATTACHMENT_RETENTION_DAYS: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate public repository privacy
        run: python scripts/check_repository_privacy.py
      - name: Validate runtime configuration
        run: python scripts/check_config.py
      - name: Run migrations
        run: alembic upgrade head
      - name: Compile Python
        run: python -m compileall app scripts
      - name: Run tests
        run: pytest -q
      - name: Validate restore CLI import
        run: python scripts/restore_backup.py --help
      - name: Validate attachment retention CLI import
        run: python scripts/cleanup_attachments.py --help
      - name: Validate Docker Compose
        run: docker compose config -q
