name: AutoPassport CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./data/ci.db
      STORAGE_PATH: ./data/storage
      BACKUP_PATH: ./data/backups
      ADMIN_BACKUP_TOKEN: ci-admin-token
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      COOKIE_SECURE: false
      ATTACHMENT_RETENTION_DAYS: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap release verification report
        shell: bash
        run: |
          mkdir -p data/reports
          cat > data/reports/release-check.json <<'JSON'
          {
            "status": "bootstrap",
            "passed": false,
            "failed_steps": ["workflow_before_release_runner"],
            "message": "Release runner did not replace the bootstrap report. Inspect preceding workflow steps."
          }
          JSON
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete release verification
        run: python scripts/release_check.py --report-path data/reports/release-check.json
      - name: Publish explicit release commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'data/reports/release-check.json';
            let report = { passed: false, failed_steps: ['report_unavailable'] };
            try {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } catch (error) {
              core.warning(`Unable to read release report: ${error.message}`);
            }
            const failed = Array.isArray(report.failed_steps) ? report.failed_steps : [];
            const passed = report.passed === true && failed.length === 0;
            const description = passed
              ? 'AutoPassport release verification passed'
              : `Release verification failed: ${(failed[0] || report.status || 'unknown').toString()}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'autopassport/release-check',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Publish release verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopassport-release-check
          path: data/reports/release-check.json
          if-no-files-found: error
          retention-days: 14
